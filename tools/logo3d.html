<!doctype html>
<meta charset="utf-8">
<title>Rendu logo DrDXT</title>
<style>
  body { margin: 0; background: #0a0b0f; color: #ccc; font: 13px system-ui; display: flex; gap: 24px; padding: 20px; flex-wrap: wrap; align-items: center; }
  canvas#rendu { width: 512px; height: 512px; background: transparent; }
  .t { display: flex; gap: 16px; align-items: center; padding: 12px; border-radius: 8px; }
  .s { background: #202020; } .c { background: #ededed; }
</style>
<canvas id="rendu" width="1024" height="1024"></canvas>
<div><div class="t s" id="sombre"></div><div class="t c" id="claire"></div><p id="etat">rendu…</p></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('rendu');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1024, 1024, false); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(22, 1, 0.1, 50); camera.position.set(0, 0, 8.4);

// La sphère : le shader « chrome liquide » de DrDXT (ChromeLiquide.hlsl), calculé sur la surface 3D,
// éclairé par la même lumière que l'anneau (clé haut-gauche, reflet spéculaire, liseré de Fresnel cyan).
const sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 256, 256), new THREE.ShaderMaterial({
  uniforms: { Temps: { value: 3.4 }, Amplitude: { value: 0.42 }, Frequence: { value: 2.2 }, Irisation: { value: 0.92 }, Luminosite: { value: 1.75 } },
  vertexShader: `
    varying vec3 vN; varying vec3 vV; varying vec3 vObj;
    void main() {
      vObj = normalize(position);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float Temps, Amplitude, Frequence, Irisation, Luminosite;
    varying vec3 vN; varying vec3 vV; varying vec3 vObj;
    void main() {
      vec2 p = vec2(atan(vObj.x, vObj.z) / 3.14159265, vObj.y) * 2.6;
      for (float i = 1.0; i < 10.0; i += 1.0) {
        p.x += Amplitude / i * cos(i * Frequence * p.y + Temps);
        p.y += Amplitude / i * cos(i * Frequence * p.x + Temps);
      }
      float s = sin(Temps - p.y - p.x);
      float crete = smoothstep(0.0, 1.0, clamp(0.16 / sqrt(s * s + 0.0081), 0.0, 1.0));
      float t = fract(p.x * 0.18 + p.y * 0.11 + Temps * 0.07) * 3.0;
      vec3 cyan = vec3(0.24, 0.90, 1.0), violet = vec3(0.58, 0.44, 1.0), magenta = vec3(1.0, 0.36, 0.78);
      vec3 iris = t < 1.0 ? mix(cyan, violet, t) : t < 2.0 ? mix(violet, magenta, t - 1.0) : mix(magenta, cyan, t - 2.0);
      vec3 teinte = vec3(0.30, 0.33, 0.38);
      vec3 metal = teinte * (0.30 + 0.70 * crete) + crete * crete * 1.05;
      vec3 chrome = mix(metal, metal * (0.2 + iris * 1.7), Irisation);

      vec3 N = normalize(vN), V = normalize(vV), L = normalize(vec3(-0.55, 0.65, 0.55));
      vec3 H = normalize(L + V);
      float diffus = 0.38 + 0.62 * max(dot(N, L), 0.0);
      float speculaire = pow(max(dot(N, H), 0.0), 90.0) * 1.4 + pow(max(dot(N, H), 0.0), 10.0) * 0.18;
      float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0);
      vec3 c = chrome * diffus * Luminosite + speculaire + fresnel * vec3(0.24, 0.90, 1.0) * 0.85;
      c = 0.95 * (1.0 - exp(-1.5 * max(c, 0.0)));
      gl_FragColor = vec4(c, 1.0);
    }`,
}));
scene.add(sphere);

// L'anneau : un vrai tore 3D, métal cyan dans la même lumière, légèrement incliné pour qu'on lise son volume.
const anneau = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.1, 64, 256), new THREE.MeshPhysicalMaterial({
  color: 0x2FD8F2, metalness: 0.55, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.12, emissive: 0x0E8FC0, emissiveIntensity: 0.55, toneMapped: false }));
anneau.rotation.x = 0.18; anneau.rotation.y = -0.12;
scene.add(anneau);

const cle = new THREE.DirectionalLight(0xffffff, 2.4); cle.position.set(-3, 3.5, 4); scene.add(cle);
const contre = new THREE.PointLight(0x3DF5FF, 14, 12); contre.position.set(2.5, -2, 2.5); scene.add(contre);

renderer.render(scene, camera);
const url = canvas.toDataURL('image/png');
for (const id of ['sombre', 'claire'])
  for (const s of [64, 48, 32, 24, 16]) { const im = new Image(); im.width = im.height = s; im.src = url; document.getElementById(id).appendChild(im); }
fetch('/logo-1024.png', { method: 'POST', body: url }).then(r => r.text()).then(t => document.getElementById('etat').textContent = 'enregistré : ' + t);
</script>
