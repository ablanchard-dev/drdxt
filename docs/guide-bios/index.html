<title>DrDXT · BIOS</title>
<style>
  :root { --fond: #ffffff; --texte: #111111; --doux: #4a4a4a; --trait: #d0d0d0; --accent: #0b4f9c; --alerte: #8a1c1c; --carte: #f3f3f3; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #0e0e0e; --texte: #f2f2f2; --doux: #c4c4c4; --trait: #3a3a3a; --accent: #8cc2ff; --alerte: #ff9b9b; --carte: #1b1b1b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 8px 0 4px; }
  h2 { font-size: 1.1rem; margin: 24px 0 8px; border-bottom: 2px solid var(--trait); padding-bottom: 4px; }
  .donnee { color: var(--doux); overflow-wrap: anywhere; }
  .touche { background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 12px; margin: 8px 0; }
  kbd { font: 700 1.1rem ui-monospace, "Cascadia Mono", Consolas, monospace; border: 2px solid var(--texte); border-radius: 6px; padding: 0 8px; }
  ol { padding-left: 1.4rem; margin: 0; }
  li { margin: 0 0 14px; }
  .valeur { display: block; margin-top: 4px; font: 600 1rem ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--carte);
            border-left: 4px solid var(--accent); padding: 8px; border-radius: 4px; overflow-wrap: anywhere; }
  .note { border-left: 4px solid var(--alerte); padding: 8px 12px; background: var(--carte); }
  a { color: var(--accent); font-weight: 600; overflow-wrap: anywhere; }
  footer { color: var(--doux); font-size: 0.9rem; margin: 32px 0 16px; }
  .erreur { color: var(--alerte); font-weight: 600; }
  [hidden] { display: none; }
</style>

<body>
<main>

  <p id="erreur" class="erreur" hidden></p>
  <div id="guide" hidden>
    <p class="note" id="avertissement"></p>
    <p class="donnee" id="carte" hidden></p>
    <div class="touche" id="entree" hidden></div>
    <h2 id="titre-avant"></h2>

    <h2 id="titre-etapes"></h2>
    <ol id="etapes"></ol>
    <div class="touche" id="sauvegarde" hidden></div>
    <p class="note" id="csm" hidden></p>
    <h2 id="titre-apres"></h2>
    <ol id="secours-bas"></ol>
    <p id="manuel" hidden></p>
  </div>
  <footer id="pied"></footer>
</main>

d Cores to the supported route here:", "Pcie": "Check your PCIe link speed here:", "BiosVersion": "Check for a newer BIOS version here:", "Generic": "Adjust this setting here:", "NoBootNormal": "A black screen or no display after the first reboot is normal: nothing is broken.", "MemoryTraining": "Wait 30 to 60 seconds for memory training to finish. Do not cut the power.", "ClearCmos": "If it still will not boot, Clear CMOS (the button/jumper on your motherboard, or remove the battery for a minute) to reset the BIOS safely.", "LoadDefaults": "Back in the BIOS, use Load Optimized Defaults to return to a known-good state.", "OneChangeAtATime": "Then re-apply one change at a time, rebooting between each, so you know which setting caused any issue.", "RebarNeedsCsmOff": "If Resizable BAR refuses to turn on: on most boards it also needs CSM (Compatibility Support Module) disabled. We do not walk you through that one: set wrong, it can stop the machine booting. So change it only if you are comfortable, and one setting at a time.", "CsmSuppressed": "Your system boots in Legacy mode, so we did not advise disabling CSM: doing so could prevent your PC from booting. Leave it as it is."}}</script>

Mode (F6) > Advanced > AMD CBS > CPU Common Options > CPPC Preferred Cores  →  CPPC Preferred Cores  →  = Auto / Enabled","O1-ogC":"Advanced Mode (F6) > Advanced > Chipset Configuration > Above 4G Decoding  →  Above 4G Decoding  →  = Enabled","73vjab":"Advanced Mode (F6) > Advanced > Chipset Configuration > Re-Size BAR Support  →  Re-Size BAR Support  →  = Enabled","OmYxm9":"Advanced Mode (F6) > Boot > CSM (Compatibility Support Module)  →  CSM  →  = Disabled","wXDBTW":"Advanced Mode (F6) > OC Tweaker > DRAM Profile Configuration > Load XMP/EXPO Setting  →  Load XMP / EXPO Setting  →  = XMP/EXPO 1.0 / Enabled","CxuULM":"Advanced Mode (F7) > Advanced > AMD CBS > CPU Common Options > CPPC Preferred Cores  →  CPPC Preferred Cores  →  = Auto / Enabled","TwzDP_":"Advanced Mode (F7) > Advanced > PCI Subsystem Settings > Above 4G Decoding  →  Above 4G Decoding  →  = Enabled","WGYnnu":"Advanced Mode (F7) > Advanced > PCI Subsystem Settings > Re-Size BAR Support  →  Re-Size BAR Support  →  = Enabled","TgIhl7":"Advanced Mode (F7) > Ai Tweaker > Ai Overclock Tuner  →  Ai Overclock Tuner  →  = EXPO I (AMD) / XMP I (Intel)","W2uWQs":"Advanced Mode (F7) > Boot > CSM (Compatibility Support Module) > Launch CSM  →  Launch CSM  →  = Disabled","GMqAnL":"Ai Tweaker (look for the memory profile)  →  Ai Overclock Tuner / XMP / EXPO  →  = EXPO / XMP enabled","t627bD":"BIOS  →  CSM Support  →  = Disabled","oYkz0j":"Boot  →  CSM  →  = Disabled","081E-G":"Boot / Windows OS Configuration section  →  CSM (Compatibility Support Module)  →  = Disabled","WPv5YM":"Boot > CSM (Compatibility Support Module)  →  Launch CSM  →  = Disabled","RkPcqZ":"OC (look for the memory profile)  →  EXPO / XMP / A-XMP  →  = Profile 1 / Enabled","-ul_T3":"OC > Advanced CPU Configuration > AMD CBS  →  CPPC Preferred Cores  →  = Auto / Enabled","Yx304x":"OC Tweaker > DRAM Profile Configuration  →  Load XMP / EXPO Setting  →  = XMP/EXPO 1.0 / Enabled","B0AIqa":"Overclocking / Tweaker / Ai Tweaker section of your BIOS  →  XMP / EXPO / DOCP / A-XMP (the memory profile)  →  = Profile 1 / Enabled","_efyB4":"Settings > AMD CBS > CPU Common Options  →  CPPC Preferred Cores  →  = Auto / Enabled","Ibinfr":"Settings > Advanced > PCI Subsystem Settings  →  Above 4G memory  →  = Enabled","GT155k":"Settings > Advanced > PCI Subsystem Settings  →  Re-Size BAR Support  →  = Enabled","4IzOdZ":"Settings > Advanced > Windows OS Configuration  →  BIOS UEFI/CSM Mode  →  = UEFI","73brL0":"Settings > Miscellaneous  →  Above 4G Decoding  →  = Enabled","ilAUEw":"Settings > Miscellaneous  →  Re-Size BAR Support  →  = Enabled","dj4Jvu":"Tweaker (look for the memory profile)  →  Extreme Memory Profile (X.M.P.) / EXPO  →  = Profile1 / Enabled"}</script>

<script>
"use strict";
(async function () {
  const textes = JSON.parse(document.getElementById("textes").textContent);
  const regles = JSON.parse(document.getElementById("regles").textContent);
  const valeurs = JSON.parse(document.getElementById("valeurs").textContent);
  const touches = JSON.parse(document.getElementById("touches").textContent);
  const ui = {
    fr: {
      avertissement: "Ces consignes viennent de DrDXT sur ton PC. Si tu n'as pas scanné ce QR toi-même depuis DrDXT, ne les suis pas.",
      carte: "Carte mère détectée par DrDXT : ",
      entree: "Pour entrer dans le BIOS, appuie plusieurs fois sur cette touche dès l'allumage : ",
      sauvegarde: "Pour sauvegarder et redémarrer : ",
      avant: "Avant de commencer",
      etapes: "Les réglages, dans l'ordre",
      apres: "Si le PC ne redémarre pas",
      manuel: "Manuel de la carte",
      pied: "Ce guide est dans l'adresse de la page : rien n'est envoyé, il est lu sur ton téléphone. DrDXT ne modifie jamais ton BIOS.",
      erreur: "Cette adresse ne contient pas de guide lisible. Rescanne le QR depuis DrDXT."
    },
    en: {
      avertissement: "These instructions come from DrDXT on your PC. If you did not scan this QR yourself from DrDXT, do not follow them.",
      carte: "Motherboard detected by DrDXT: ",
      entree: "To enter the BIOS, press this key repeatedly as soon as the PC powers on: ",
      sauvegarde: "To save and restart: ",
      avant: "Before you start",
      etapes: "The settings, in order",
      apres: "If the PC does not restart",
      manuel: "Board manual",
      pied: "This guide is in the page address: nothing is sent, it is read on your phone. DrDXT never changes your BIOS.",
      erreur: "This address does not contain a readable guide. Scan the QR again from DrDXT."
    }
  };
  const $ = (id) => document.getElementById(id);
  const langueDuTelephone = (navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en";
  const motif = (cle) => new RegExp(regles[cle], "u");
  const carte = motif("carte"), manuel = motif("manuel");
  const lien = new RegExp(regles.lien, "iu"), tension = new RegExp(regles.tension, "u");
  const MAX_JSON = 20000;

  function echec() {
    document.documentElement.lang = langueDuTelephone;
    $("erreur").textContent = ui[langueDuTelephone].erreur;
    $("erreur").hidden = false;
    $("pied").textContent = ui[langueDuTelephone].pied;
  }

  // Des listes fermées : les phrases, les valeurs de menu et les touches de la page. Une adresse n'en porte que les codes ;
  // seul le nom de la carte voyage en clair, borné, et se dit comme le nom détecté.
  function valide(d) {
    if (!d || typeof d !== "object" || d.v !== 2 || (d.l !== "fr" && d.l !== "en")) return false;
    const dans = (liste, x) => typeof x === "string" && Object.prototype.hasOwnProperty.call(liste, x);
    const connu = (x) => dans(textes[d.l], x);
    const propre = (x) => !lien.test(x) && !tension.test(x);
    const codes = (x) => Array.isArray(x) && x.length > 0 && x.length <= 20 && x.every(connu);
    return typeof d.c === "string" && carte.test(d.c) && propre(d.c)
      && (d.e === undefined || dans(touches, d.e)) && (d.s === undefined || dans(touches, d.s))
      && Array.isArray(d.p) && d.p.length <= 20
      && d.p.every((e) => Array.isArray(e) && (e.length === 1 || e.length === 2) && connu(e[0]) && (e.length === 1 || dans(valeurs, e[1])))
      && codes(d.h) && (d.b === undefined || codes(d.b))
      && (d.n === undefined || connu(d.n))
      && (d.m === undefined || (typeof d.m === "string" && manuel.test(d.m)));
  }

  // Décompressé par morceaux, coupé au-delà de la taille d'un guide : une adresse forgée ne gonfle pas en mégaoctets.
  async function lireBorne(flux) {
    const lecteur = flux.getReader();
    const morceaux = [];
    let total = 0;
    for (;;) {
      const { done, value } = await lecteur.read();
      if (done) break;
      total += value.length;
      if (total > MAX_JSON) { await lecteur.cancel(); throw new Error("taille"); }
      morceaux.push(value);
    }
    const tout = new Uint8Array(total);
    let i = 0;
    for (const m of morceaux) { tout.set(m, i); i += m.length; }
    return new TextDecoder("utf-8", { fatal: true }).decode(tout);
  }

  try {
    const fragment = location.hash.slice(1);
    if (!/^[A-Za-z0-9_-]{1,4000}$/.test(fragment)) throw new Error("fragment");
    let b64 = fragment.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    const octets = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const d = JSON.parse(await lireBorne(new Blob([octets]).stream().pipeThrough(new DecompressionStream("deflate-raw"))));
    if (!valide(d)) throw new Error("forme");

    const t = ui[d.l];
    const phrase = (code) => textes[d.l][code];
    document.documentElement.lang = d.l;

    $("avertissement").textContent = t.avertissement;
    if (d.c) {
      const nom = document.createElement("span");
      nom.textContent = d.c;
      $("carte").textContent = t.carte;
      $("carte").append(nom);
      $("carte").hidden = false;
    }

    function laTouche(id, libelle, cle) {
      if (!cle) return;
      const el = $(id);
      el.append(document.createTextNode(libelle));
      const k = document.createElement("kbd");
      k.textContent = cle;
      el.append(k);
      el.hidden = false;
    }
    laTouche("entree", t.entree, d.e === undefined ? "" : touches[d.e]);
    laTouche("sauvegarde", t.sauvegarde, d.s === undefined ? "" : touches[d.s]);

    function liste(id, lignes) {
      for (const l of lignes) {
        const li = document.createElement("li");
        li.textContent = phrase(l);
        $(id).append(li);
      }
    }
    $("titre-avant").textContent = t.avant;
    liste("secours-haut", d.h);
    $("titre-apres").textContent = t.apres;
    liste("secours-bas", d.b === undefined ? d.h : d.b);

    $("titre-etapes").textContent = t.etapes;
    for (const e of d.p) {
      const li = document.createElement("li");
      li.append(document.createTextNode(phrase(e[0])));
      if (e.length === 2) {
        const v = document.createElement("span");
        v.className = "valeur";
        v.textContent = valeurs[e[1]];
        li.append(v);
      }
      $("etapes").append(li);
    }

    if (d.n !== undefined) { $("csm").textContent = phrase(d.n); $("csm").hidden = false; }
    if (d.m !== undefined) {
      const a = document.createElement("a");
      a.href = d.m;
      a.rel = "noopener noreferrer";
      a.textContent = t.manuel;
      $("manuel").append(a);
      $("manuel").hidden = false;
    }
    $("pied").textContent = t.pied;
    $("guide").hidden = false;
  } catch (e) {
    echec();
  }
})();
</script>
