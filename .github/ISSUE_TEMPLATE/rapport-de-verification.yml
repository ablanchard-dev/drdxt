name: Rapport de vérification
description: Le rapport de « Vérifier DrDXT sur mon PC » ou du zip de validation, pour prouver DrDXT sur ton matériel.
title: "Vérification : <processeur> + <carte graphique>"
labels: ["preuve"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Le rapport est dans `Documents\verification-drdxt-<date>.txt` (bouton de l'App) ou dans `Téléchargements\DrDXT-validation-<date>.txt` (zip de validation).
        Avant d'être écrit, il est passé par les mêmes règles que la machine exportée : le nom du PC et du compte, le dossier utilisateur, les numéros de série, les adresses MAC et IP, les identifiants de compte et de volume et les adresses de courriel en sont retirés. Il reste les modèles du matériel, la version du pilote et les réglages testés. Relis-le avant de l'envoyer.
  - type: textarea
    id: rapport
    attributes:
      label: Le rapport
      description: Glisse le fichier ici, ou colle son contenu.
    validations:
      required: true
  - type: textarea
    id: remarques
    attributes:
      label: Ce que tu as remarqué
      description: Un réglage qui ne s'est pas rendu, un écran étrange, une partie plus fluide ou moins fluide après.
